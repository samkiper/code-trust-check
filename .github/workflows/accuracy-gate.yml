name: accuracy-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  accuracy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: app

      - name: Check out pinned OWASP BenchmarkPython
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OWASP-Benchmark/BenchmarkPython
          ref: f1291485808b66e20ddb6b01b10dc71b3df8c8ba
          path: owasp

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install scanner
        run: python -m pip install -r app/requirements.txt

      - name: Run unit and regression tests
        working-directory: app
        run: python -m unittest discover -s tests -v

      - name: Enforce accuracy thresholds
        working-directory: app
        run: python scripts/run_accuracy_gate.py --owasp-dir ../owasp --limit 750 --holdout-limit 300 --report accuracy-report.json

      - name: Confirm committed report is current
        working-directory: app
        run: git diff --exit-code -- accuracy-report.json
