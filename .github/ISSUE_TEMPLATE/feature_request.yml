name: Feature request
description: Suggest a practical improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Describe the ideal workflow
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most?
      options:
        - Beginner or AI-assisted builder
        - Professional developer
        - Repository maintainer
        - Team or security reviewer
        - Everyone
    validations:
      required: true

