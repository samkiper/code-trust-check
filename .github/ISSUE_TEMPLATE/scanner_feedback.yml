name: Scanner feedback
description: Report a false positive or missed risk with a minimal non-sensitive example.
title: "[Scanner feedback]: "
labels: [scanner-feedback]
body:
  - type: markdown
    attributes:
      value: "Never paste live credentials, private code, personal data, or private repository information. Feedback is reviewed before it can influence a rule or regression test."
  - type: dropdown
    id: result
    attributes:
      label: Result type
      options:
        - False positive
        - Missed risk
        - Severity concern
        - Explanation or fix concern
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language and scanner version
      placeholder: Python, v20
    validations:
      required: true
  - type: textarea
    id: intent
    attributes:
      label: Intended behavior
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal sanitized reproducer
      render: text
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Why should the result change?
    validations:
      required: true

