rules:
  - id: javascript.query-redirect
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    message: A query parameter may control a browser navigation destination.
    metadata:
      confidence: medium
      explanation: Validate the destination against an explicit allowlist before redirecting; the value could lead to an untrusted site.
    pattern-sources:
      - pattern: new URLSearchParams(location.search).get(...)
      - pattern: new URLSearchParams(window.location.search).get(...)
      - pattern: new URLSearchParams(document.location.search).get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: location.href = $VALUE
              - pattern: window.location.href = $VALUE
              - pattern: document.location.href = $VALUE
              - pattern: location.assign($VALUE)
              - pattern: window.location.assign($VALUE)
              - pattern: document.location.assign($VALUE)
              - pattern: location.replace($VALUE)
              - pattern: window.location.replace($VALUE)
              - pattern: document.location.replace($VALUE)
          - focus-metavariable: $VALUE

  - id: python.dynamic-eval
    languages: [python]
    severity: ERROR
    message: Dynamic eval can execute attacker-controlled Python.
    metadata:
      confidence: high
      explanation: Treat evaluated text as executable code and validate its source.
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: python.shell-true
    languages: [python]
    severity: ERROR
    message: A subprocess uses shell=True, which can enable command injection.
    metadata:
      confidence: high
      explanation: Pass an argument list and keep shell=False when input is not fully trusted.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python.implicit-shell
    languages: [python]
    severity: WARNING
    message: This subprocess API invokes a shell; review the command and its inputs.
    metadata:
      confidence: high
      explanation: Prefer a fixed executable with an argument list. Shell invocation alone does not prove input is exploitable.
    pattern-either:
      - pattern: subprocess.getoutput(...)
      - pattern: subprocess.getstatusoutput(...)

  - id: python.unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Unsafe deserialization can execute code from untrusted input.
    metadata:
      confidence: high
      explanation: Use a non-executable data format or a safe loader for untrusted data.
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
          - pattern: pickle.Unpickler(...).load(...)
          - pattern: marshal.load(...)
          - pattern: marshal.loads(...)
          - pattern: dill.load(...)
          - pattern: dill.loads(...)

  - id: python.yaml-unsafe-load
    languages: [python]
    severity: WARNING
    message: yaml.load without a safe loader may construct unsafe Python objects.
    metadata:
      confidence: high
      explanation: Prefer yaml.safe_load for data that is not completely trusted.
    pattern-either:
      - pattern: yaml.load($DATA)
      - pattern: yaml.load($DATA, Loader=yaml.Loader)
      - pattern: yaml.load($DATA, yaml.Loader)
      - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
      - pattern: yaml.load($DATA, yaml.UnsafeLoader)

  - id: javascript.dynamic-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic eval can execute attacker-controlled JavaScript.
    metadata:
      confidence: high
      explanation: Parse data explicitly instead of executing text as code.
    pattern: eval(...)

  - id: javascript.child-process-exec
    languages: [javascript, typescript]
    severity: WARNING
    message: child_process.exec invokes a shell and needs strict input control.
    metadata:
      confidence: medium
      explanation: Prefer execFile or spawn with a fixed executable and argument list.
    pattern-either:
      - pattern: child_process.exec(...)
      - patterns:
          - pattern-inside: |
              const $CP = require("child_process");
              ...
          - pattern: $CP.exec(...)
      - patterns:
          - pattern-inside: |
              const $CP = require("node:child_process");
              ...
          - pattern: $CP.exec(...)
      - patterns:
          - pattern-inside: |
              import * as $CP from "child_process";
              ...
          - pattern: $CP.exec(...)
      - patterns:
          - pattern-inside: |
              import * as $CP from "node:child_process";
              ...
          - pattern: $CP.exec(...)
      - patterns:
          - pattern-inside: |
              import { exec as $RUN } from "child_process";
              ...
          - pattern: $RUN(...)
      - patterns:
          - pattern-inside: |
              import { exec as $RUN } from "node:child_process";
              ...
          - pattern: $RUN(...)

  - id: shell.download-pipe-execute
    languages: [bash]
    severity: ERROR
    message: Downloaded content is piped directly into a shell.
    metadata:
      confidence: high
      explanation: Download, verify, inspect, and only then execute a pinned artifact.
    pattern-regex: '(?i)\b(curl|wget)\b[^\n|]*\|\s*(ba)?sh\b'

  - id: javascript.url-to-html
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: URL-controlled content reaches an HTML injection sink.
    metadata:
      confidence: high
      explanation: A URL parameter can contain attacker-controlled markup. Use textContent for plain text or a reviewed HTML sanitizer.
    pattern-sources:
      - pattern: location.search
      - pattern: window.location.search
      - pattern: document.location.search
      - pattern: location.hash
      - pattern: window.location.hash
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $VALUE
              - pattern: $EL.outerHTML = $VALUE
              - pattern: $EL.insertAdjacentHTML($POSITION, $VALUE)
              - pattern: document.write($VALUE)
          - focus-metavariable: $VALUE
